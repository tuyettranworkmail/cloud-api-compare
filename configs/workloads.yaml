mix: {read: 0.7, write: 0.2, cpu: 0.1}
steady:
  rates: {low: 5, medium: 20, high: 50}
  warmup_seconds: 45
  measurement_seconds: 180
burst:
  warmup_seconds: 45
  baseline_rps: 10
  peak_rps: 100
  baseline_seconds: 60
  ramp_seconds: 2
  hold_seconds: 60
  recovery_seconds: 60
idle:
  idle_seconds: 1200
  warm_requests: 20
  interval_seconds: 1
preallocated_vus: 30
max_vus: 200
graceful_stop_seconds: 35
