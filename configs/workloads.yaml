mix: { read: 0.7, write: 0.2, cpu: 0.1 }
steady:
  rates: { low: 1, medium: 2, high: 3 }
  warmup_seconds: 5
  measurement_seconds: 10
burst:
  warmup_seconds: 5
  baseline_rps: 1
  peak_rps: 3
  baseline_seconds: 10
  ramp_seconds: 2
  hold_seconds: 3
  recovery_seconds: 10
idle:
  idle_seconds: 60
  warm_requests: 5
  interval_seconds: 1
preallocated_vus: 5
max_vus: 10
graceful_stop_seconds: 10
