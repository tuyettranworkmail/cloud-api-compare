openapi: 3.1.0
info:
  title: ccapi
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /items/{item_id}:
    get:
      summary: Get Item
      operationId: get_item_items__item_id__get
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /items:
    post:
      summary: Create Item
      operationId: create_item_items_post
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '200':
          description: 'Trùng Idempotency-Key: trả lại bản ghi đã có, không ghi đôi'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /compute:
    get:
      summary: Run Compute
      operationId: run_compute_compute_get
      parameters:
      - name: n
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000000
          minimum: 1
          default: 200000
          title: N
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ItemIn:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        category:
          type: string
          maxLength: 50
          minLength: 1
          title: Category
        value:
          type: integer
          title: Value
        payload:
          type: string
          maxLength: 2048
          title: Payload
      type: object
      required:
      - name
      - category
      - value
      - payload
      title: ItemIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
