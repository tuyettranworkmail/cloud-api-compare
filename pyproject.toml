[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-cost-analysis"
version = "1.0.0"
description = "Reproducible IaaS/PaaS/FaaS benchmark research toolkit"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "matplotlib>=3.9,<4", "seaborn>=0.13,<1", "plotly>=6,<7",
  "PyYAML>=6,<7", "httpx>=0.28,<1", "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2", "psutil>=6,<8", "google-cloud-monitoring>=2.24,<3",
  "google-cloud-logging>=3.11,<4", "google-cloud-billing>=1.16,<2",
  "google-auth>=2.37,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8",
  "streamlit>=1.45,<2", "pytest>=8.3,<10", "ruff>=0.11,<1", "openpyxl>=3.1.5,<4"
]

[project.scripts]
cloudbench = "benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
